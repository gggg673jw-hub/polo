<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nova AI Chatbot</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <h1>✦ polo</h1>
      <p>Your study companion</p>
      <button id="clearBtn" type="button">＋ New chat</button>
      <small>Demo chatbot • Runs in your browser</small>
    </aside>
    <main class="chat-panel">
      <header><strong>Nova AI Assistant</strong><span>● Online demo</span></header>
      <section id="messages" class="messages" aria-label="Conversation" aria-live="polite"></section>
      <form id="chatForm" class="composer">
        <input id="messageInput" type="text" placeholder="Ask me something..." aria-label="Your message" maxlength="500" autocomplete="off" required>
        <button type="submit">Send ➤</button>
      </form>
      <p class="disclaimer">Demo responses are rule-based, not generated by a real AI model.</p>
    </main>
  </div>
</body>
</html>
